# Supabase pauses a free project after 7 days with no activity, and a paused
# project takes the whole app down until someone restores it by hand. One cheap
# request a day keeps the clock reset (D4).
#
# Daily rather than weekly on purpose: GitHub documents that scheduled runs can
# be delayed or dropped entirely under load, so a weekly ping has no margin —
# one missed run would be enough to pause the project.
name: keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily; an odd minute avoids the on-the-hour queue
  workflow_dispatch: # so it can also be triggered by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # public.ping is the one table a signed-out reader may see, and it holds
          # nothing but a timestamp. Every other table still refuses this key, so
          # the workflow proves the database is awake without being able to read
          # a single figure from the books.
          # Both headers, not just apikey: a publishable key (sb_publishable_…)
          # is rejected with 401 unless it is also presented as the bearer token.
          # supabase-js sends both, which is why the browser never sees this.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/ping?select=id&limit=1")
          echo "HTTP $status"
          # 200 means the database answered. Anything else — 000 for no answer at
          # all, 5xx for a paused or failing project — should fail loudly here
          # rather than quietly stop keeping anything alive.
          [ "$status" = "200" ]
